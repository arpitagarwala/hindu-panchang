# Run separately: docker compose --env-file .env.production -f compose.production.yaml up --build -d
services:
  panchang:
    build:
      context: .
      args:
        SITE_URL: https://${PANCHANG_DOMAIN:?Set PANCHANG_DOMAIN}
        SITE_INDEXING: ${SITE_INDEXING:-false}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    environment:
      PANCHANG_DATA_MODE: local
      SITE_URL: https://${PANCHANG_DOMAIN:?Set PANCHANG_DOMAIN}
      SITE_INDEXING: ${SITE_INDEXING:-false}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
  proxy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PANCHANG_DOMAIN: ${PANCHANG_DOMAIN:?Set PANCHANG_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      panchang:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
